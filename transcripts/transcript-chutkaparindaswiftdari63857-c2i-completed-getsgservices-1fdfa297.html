        async function decrypt() {
            const key = Uint8Array.from(atob(key_b64), c => c.charCodeAt(0));
            const nonce = Uint8Array.from(atob(nonce_b64), c => c.charCodeAt(0));
            const ciphertext = Uint8Array.from(atob(cipher_b64), c => c.charCodeAt(0));

            try {
                const cryptoKey = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]);
                const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, cryptoKey, ciphertext);
                const html = new TextDecoder().decode(plaintext);
                const iframe = document.createElement("iframe");
                iframe.style = "width:100%; height:100vh; border:none;";
                iframe.srcdoc = html;
                document.getElementById("output").appendChild(iframe);
            } catch (e) {
                document.body.innerHTML = "❌ Decryption failed or transcript was tampered.";
                console.error(e);
            }
        }
        decrypt();
